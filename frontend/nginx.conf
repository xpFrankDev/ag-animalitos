server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirecciones con $http_host para conservar el puerto cuando se prueba en local
  # (http://localhost:8080) y el dominio cuando corre detrás del nginx del VPS.
  location = / { return 302 $scheme://$http_host/animalitos/; }
  location = /animalitos { return 301 $scheme://$http_host/animalitos/; }

  location /animalitos/api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # La documentación de la API no se expone a través del proxy público.
  location ^~ /animalitos/api/documentacion {
    return 404;
  }

  # nginx no trae el tipo del manifiesto web: sin esto se sirve como binario y el navegador lo ignora.
  location = /animalitos/manifest.webmanifest {
    default_type application/manifest+json;
    try_files /manifest.webmanifest =404;
  }

  location /animalitos/ {
    rewrite ^/animalitos/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
}
